[package]
name = "gatepass"
description = "Pay, and get an SSH certificate signed by NEAR Chain Signatures for exactly the minutes you paid for"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(near)"]
